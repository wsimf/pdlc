[project]
name = "pdlc"
version = "0.1.0"
description = "GitHub-native product development lifecycle tooling"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
pdlc = "pdlc.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.11,<2"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/pdlc/domain/records.py",
    "src/pdlc/hosts/workitem_host/base.py",
    "src/pdlc/hosts/code_host/base.py",
    "src/pdlc/hosts/lib/process.py",
    "src/pdlc/hosts/lib/file/storage.py",
]
strict = true
follow_imports = "silent"
